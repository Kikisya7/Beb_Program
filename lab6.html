<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <title>Лабораторна 6 — SVG</title>
  <style>
    body{
      background:#f5f5f5;
      font-family:Arial, sans-serif;
      padding:20px;
    }
    .wrap{
      background:white;
      padding:20px;
      border-radius:10px;
      max-width:900px;
      margin:auto;
      box-shadow:0 6px 16px rgba(0,0,0,.1);
    }
  </style>
</head>

<body>
<div class="wrap">

<h2>Лабораторна робота №6 — SVG</h2>


<svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg">

  <!-- Осі -->
  <g stroke="black" stroke-width="3">
    <line x1="60" y1="260" x2="820" y2="260"/>  <!-- X -->
    <line x1="120" y1="40" x2="120" y2="480"/>  <!-- Y -->
  </g>


  <g font-size="12" fill="black" text-anchor="middle">
    <text x="120" y="280">0</text>
    <text x="180" y="280">1</text>
    <text x="240" y="280">2</text>
    <text x="300" y="280">3</text>
    <text x="360" y="280">4</text>
    <text x="420" y="280">5</text>
    <text x="480" y="280">6</text>

    <text x="100" y="200" text-anchor="end">1</text>
    <text x="100" y="140" text-anchor="end">2</text>
    <text x="100" y="320" text-anchor="end">-1</text>
    <text x="100" y="380" text-anchor="end">-2</text>
  </g>

  <!-- Головна система координат -->
  <g transform="translate(120,260) scale(60,-60)">


    <!-- квадрат Y(1;2) X(0;1) -->
    <rect x="0" y="1" width="1" height="1" fill="#1d6fa5"/>

    <!-- квадрат Y(-1;-2) X(0;1) -->
    <rect x="0" y="-2" width="1" height="1" fill="#1d6fa5"/>

    <!-- квадрат Y(1;2) X(5;6) -->
    <rect x="5" y="1" width="1" height="1" fill="#1d6fa5"/>

    <!-- квадрат Y(-1;-2) X(5;6) — перекручування -->
    <g transform="translate(5,-2)">
      <rect x="0" y="0" width="1" height="1" fill="#1d6fa5"/>
      <animateTransform attributeName="transform" type="skewX" values="0;20;-20;0"
                        dur="3s" repeatCount="indefinite" additive="sum"/>
    </g>

    <!-- квадрат Y(0;-1) X(4;5) -->
    <rect x="4" y="-1" width="1" height="1" fill="#1d6fa5"/>

    <rect x="1" y="-1" width="1" height="1" fill="#1d6fa5"/>


    <!-- коло Y(0;2) X(1;3) -> центр (2,1), r=1 -->
    <g id="circle1">
      <circle cx="2" cy="1" r="1" fill="#248fff"/>
      <animate attributeName="fill"
               values="#248fff; #ff6b6b; #ffd66b; #248fff"
               dur="5s" repeatCount="indefinite"/>
    </g>

    <!-- коло Y(0;2) X(3;5) -> центр (4,1), r=1 -->
    <g id="circle2">
      <circle cx="4" cy="1" r="1" fill="#1d6fa5"/>
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 0.3 0; 0 0; -0.3 0; 0 0"
                        dur="4s" repeatCount="indefinite"/>
    </g>

    <!-- коло Y(-1;-2) X(4;5) -> центр (4.5,-1.5), r=0.5 — масштаб -->
    <g transform="translate(4.5,-1.5)">
      <circle cx="0" cy="0" r="0.5" fill="#1d6fa5"/>
      <animateTransform attributeName="transform" type="scale"
                        values="1;1.6;1" dur="3s" repeatCount="indefinite"
                        additive="sum"/>
    </g>


    <!-- трикутник: вершина (3,0), низ: (2,-2), (4,-2) -->
    <g transform="translate(3,-0.6666)">
      <polygon points="3,0 2,-2 4,-2"
               fill="#1d6fa5" stroke="#0b3e6b" stroke-width="0.03"/>
      <animateTransform attributeName="transform" type="rotate"
                        from="0" to="360"
                        dur="5s" repeatCount="indefinite"/>
    </g>


    <defs>
      <path id="curve"
            d="M 0.5 2.6 C 3 2.9 6 2.9 8 2.6"/>
    </defs>

    <text font-family="Georgia" font-size="0.18" fill="#333">
      <textPath href="#curve">
        Лабораторна робота №6 — текст по кривій
      </textPath>
    </text>

  </g>
</svg>

</div>
</body>
</html>
